services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # pg_stat_statements: needed for Phase 2 query profiling.
    # shared_preload_libraries loads it at startup so EXPLAIN ANALYZE shows
    # statement-level stats without a restart.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      # Use 5433 to avoid conflicting with a locally-installed Postgres on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: required by BullMQ. allkeys-lru evicts jobs silently at OOM.
    command: redis-server --maxmemory-policy noeviction --maxmemory 256mb
    volumes:
      - redis_data:/data
    ports:
      # Use 6382 to avoid conflicting with a locally-installed Redis on 6379.
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Migrations (one-shot) ───────────────────────────────────────────────────
  # Runs to completion and exits. The api service waits for it, so every api
  # replica starts against an already-migrated schema. Running migrations from
  # the api command instead would have N replicas racing the same migration.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://todo:todo@postgres:5432/todo?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # ── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Use host.docker.internal when running without --scale on macOS/Windows.
      # Inside Compose, service names resolve correctly.
      # DB_POOL is the per-instance Prisma pool size, swept in experiment 3.
      # Prisma's default is num_cpus*2+1, which is wrong the moment you run more
      # than one instance: every replica sizes its pool as if it owned the whole
      # database. Total connections = DB_POOL x replicas, and Postgres here caps
      # at max_connections=100.
      DATABASE_URL: postgresql://todo:todo@postgres:5432/todo?schema=public&connection_limit=${DB_POOL:-10}&pool_timeout=10&connect_timeout=5
      REDIS_URL: redis://redis:6379
      # Local-only value. Validated at boot: must be >= 32 chars.
      JWT_SECRET: docker-compose-local-dev-secret-32chars
      # Change this to match your frontend origin. Comma-separated for multiple.
      CORS_ORIGINS: http://localhost:5173
    ports:
      # When --scale api=N, Docker assigns ephemeral host ports.
      # An nginx or Caddy load balancer in front removes the need for fixed ports.
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Nginx load balancer (used when --scale api=N) ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

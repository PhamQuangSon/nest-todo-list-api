events {
  worker_connections 1024;
}

http {
  upstream api_upstream {
    server api:3000;
    # Docker Compose service discovery: all replicas of "api" are resolved
    # by the embedded DNS. Round-robin is the default.
  }

  server {
    listen 80;

    # nginx is the EDGE: clients connect to it directly, so $remote_addr is the
    # only address it can vouch for. It must not believe an X-Forwarded-For the
    # client sent. This file used to have
    #
    #   real_ip_header X-Forwarded-For;  set_real_ip_from 0.0.0.0/0;
    #
    # which trusts that header from ANYONE: a client sending a fresh random
    # X-Forwarded-For per request got a fresh rate-limit bucket per request
    # (measured: 30 of 30 auth requests passed a 20/min limit).
    #
    # Only use real_ip when another trusted hop sits in front of nginx (a CDN
    # or cloud LB), and then set_real_ip_from must list THAT hop's ranges.

    location / {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      # Overwrite, do not append ($proxy_add_x_forwarded_for appends to what
      # the client sent). The app runs with TRUST_PROXY_HOPS=1, so it reads
      # exactly this one value.
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Keep websocket upgrade working for Phase 5
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";

      # Timeouts should exceed NestJS keepAliveTimeout (65s default)
      proxy_connect_timeout 10s;
      proxy_send_timeout    70s;
      proxy_read_timeout    70s;
    }
  }
}

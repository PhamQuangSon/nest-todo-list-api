events {
  worker_connections 1024;
}

http {
  upstream api_upstream {
    server api:3000;
    # Docker Compose service discovery: all replicas of "api" are resolved
    # by the embedded DNS. Round-robin is the default.
  }

  server {
    listen 80;

    # Forward real client IP so rate limiter sees the right address.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location / {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Keep websocket upgrade working for Phase 5
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";

      # Timeouts should exceed NestJS keepAliveTimeout (65s default)
      proxy_connect_timeout 10s;
      proxy_send_timeout    70s;
      proxy_read_timeout    70s;
    }
  }
}
